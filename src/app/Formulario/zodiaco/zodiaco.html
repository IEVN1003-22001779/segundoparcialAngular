<!-- Es la caja donde va el formulario -->
<div class="flex flex-wrap gap-10 p-10 font-sans text-gray-800">
    <!-- Columna Izquierda -->
    <div class="border-2 border-red-600 p-6 rounded-lg w-full max-w-md bg-white shadow-lg">
        <h3 class="text-center text-lg font-bold mb-4">Signos Zodiacales Chinos</h3>
        <p class="text-center font-bold mb-4">Datos Personales</p>

        <div class="flex items-center mb-3">
            <label class="w-24 font-semibold">Nombre</label>
            <input type="text" [(ngModel)]="nombresUsuario" placeholder="Ingresa tus nombres" class="border border-gray-400 rounded px-2 py-1 w-full flex-1">
        </div>

        <div class="flex items-center mb-3">
            <label class="w-24 font-semibold">Apellido Paterno</label>
            <input type="text" [(ngModel)]="apellidoPaterno" placeholder="Ingresa tu apellido paterno" class="border border-gray-400 rounded px-2 py-1 w-full flex-1">
        </div>

        <div class="flex items-center mb-6">
            <label class="w-24 font-semibold">Apellido Materno</label>
            <input type="text" [(ngModel)]="apellidoMaterno" placeholder="Ingresa tu apellido materno" class="border border-gray-400 rounded px-2 py-1 w-full flex-1">
        </div>

        <h3 class="text-center font-bold mb-2">Fecha de nacimiento</h3>
        <div class="flex gap-2 justify-center mb-6">
            <div class="text-center">
                <label class="block text-sm">Día</label>
                <input type="number" [(ngModel)]="dia" placeholder="Día" class="border border-gray-400 rounded px-2 py-1 w-16 text-center">
            </div>

            <div class="text-center">
                <label class="block text-sm">Mes</label>
                <input type="number" [(ngModel)]="mes" placeholder="Mes" class="border border-gray-400 rounded px-2 py-1 w-16 text-center">
            </div>

            <div class="text-center">
                <label class="block text-sm">Año</label>
                <input type="number" [(ngModel)]="anio" placeholder="Año" class="border border-gray-400 rounded px-2 py-1 w-20 text-center">
            </div>
        </div>

        <div class="mb-6 flex gap-4 items-center justify-center">
            <label class="font-semibold">Sexo:</label>
            <label><input type="radio" name="sexo" value="Masculino" [(ngModel)]="sexo"> Masculino</label>
            <label><input type="radio" name="sexo" value="Femenino" [(ngModel)]="sexo"> Femenino</label>
        </div>

        <div class="text-center">
            <button (click)="imprimir()" class="bg-red-600 text-white font-bold py-2 px-10 rounded border-4 border-red-700 hover:bg-red-700">
                Ver Signo
            </button>
        </div>
    </div>

    <!-- Columna Derecha -->
    <div *ngIf="resultado" class="flex flex-col items-center justify-center p-6 w-full max-w-md text-center text-xl font-medium">
        <p class="mb-4 text-2xl">
            <span class="font-bold italic">{{nombresUsuario}} {{apellidoPaterno}} {{apellidoMaterno}}</span>
        </p>
        
        <p class="mb-4">Tienes <span class="font-bold">{{edad}}</span> años de edad.</p>
        <p class="mb-2">Por lo que tu signo zodiacal es el: </p>
        
        <div class="w-32 h-32 rounded-full flex items-center justify-center mb-2 shadow-lg bg-blue-100">
            <img [src]="imagen" alt="Signo Zodiacal Chino" class="w-24 h-24 object-contain">
        </div>
        
        <p><span class="font-bold">{{signo}}</span></p>
    </div>
</div>
