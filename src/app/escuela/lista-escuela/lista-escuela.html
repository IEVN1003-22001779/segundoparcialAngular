<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>
 
  <form [formGroup]="formulario">
    <!-- Matricula -->
    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">
        Matrícula
      </label>
 
      <input
        type="text"
        id="matricula"
        formControlName="matricula"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matrícula"
      >
 
      <div *ngIf="formulario.get('matricula')?.touched && formulario.get('matricula')?.errors?.['required']" class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
        Este campo es requerido.
      </div>
    </div>

    <!-- Nombre -->
    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
      >
 
      <div *ngIf="formulario.get('nombre')?.touched && formulario.get('nombre')?.errors?.['required']" class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
        Este campo es requerido.
      </div>
    </div>

    <!-- Correo -->
    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">
        Correo
      </label>
 
      <input
        type="text"
        id="correo"
        formControlName="correo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >
 
      <div *ngIf="formulario.get('correo')?.touched && formulario.get('correo')?.errors?.['required']" class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
        Este campo es requerido.
      </div>
    </div>

    <!-- Materia -->
    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">
        Materia
      </label>
 
      <input
        type="text"
        id="materia"
        formControlName="materia"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      >
 
      <div *ngIf="formulario.get('materia')?.touched && formulario.get('materia')?.errors?.['required']" class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
        Este campo es requerido.
      </div>
    </div>
 
    <!-- Botones Originales -->
    <div class="mb-5">
      <div class="flex justify-end mt-5 gap-3">
        <button
          type="button"
          (click)="muestraAlumno()"
          [disabled]="formulario.invalid"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50"
        >
          Registrar
        </button>
        <!-- Dejé el botón Cargar que tenías en tu diseño original -->
        <button
          type="button"
          (click)="cargarAlumno()"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Cargar
        </button>
      </div>
    </div>
  </form>

  <h2 class="mb-4 text-2xl font-bold text-gray-900">Lista Alumnos</h2>
  
  <div class="relative overflow-x-auto">
    <table class="w-full text-sm text-left text-gray-500 border border-gray-200">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3">Matrícula</th>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Correo</th>
          <th scope="col" class="px-6 py-3">Materia</th>
          <th scope="col" class="px-6 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of alumnos; let i = index" class="bg-white border-b">
          <td class="px-6 py-4 font-medium text-gray-900">{{ alumno.matricula }}</td>
          <td class="px-6 py-4">{{ alumno.nombre }}</td>
          <td class="px-6 py-4">{{ alumno.correo }}</td>
          <td class="px-6 py-4">{{ alumno.materia }}</td>
          <td class="px-6 py-4 flex gap-2">
            <button type="button" (click)="editarAlumno(i)" class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-xs px-3 py-1.5">
              Editar
            </button>
            <button type="button" (click)="eliminarAlumnos(i)" class="text-white bg-red-700 hover:bg-red-800 font-medium rounded-lg text-xs px-3 py-1.5">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
